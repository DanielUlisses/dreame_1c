clean_rooms:
  target:
    entity:
      integration: dreame_1c
      domain: vacuum
  fields:
    rooms:
      required: true
      example: '["Suite", 2]'
      selector:
        text:
          multiple: true
    fan_speed:
      selector:
        select:
          translation_key: fan_speed
          options:
            - quiet
            - standard
            - medium
            - turbo
    water_level:
      selector:
        select:
          translation_key: water_level
          options:
            - low
            - medium
            - high
    repeats:
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box
